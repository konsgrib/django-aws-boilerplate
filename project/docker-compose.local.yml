version: '3.8'

# Local development docker-compose
# No AWS dependencies, simplified setup
# Usage: docker compose -f docker-compose.local.yml up

services:
  postgres:
    image: postgres:16-alpine
    container_name: autoakademia-postgres-local
    environment:
      POSTGRES_DB: autoakademia
      POSTGRES_USER: autoakademia
      POSTGRES_PASSWORD: localdevpassword
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoakademia"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - autoakademia-network

  django:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: autoakademia-django-local
    environment:
      DJANGO_SECRET_KEY: "local-dev-secret-key-change-in-production"
      DB_USERNAME: autoakademia
      DB_PASSWORD: localdevpassword
      DB_HOST: postgres
      DB_NAME: autoakademia
      DB_PORT: 5432
      ALLOWED_HOSTS: "*"
      DEBUG: "true"
      # For local dev, no S3 bucket needed
      S3_BUCKET: ""
      # Superuser for local testing
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@localhost
      DJANGO_SUPERUSER_PASSWORD: admin123
    volumes:
      # Mount source code for live reload
      - ./src:/app
      - static_volume_local:/app/staticfiles
      - media_volume_local:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running migrations...' &&
        python manage.py migrate --noinput &&
        echo 'Creating superuser...' &&
        python create_superuser.py &&
        echo 'Collecting static files...' &&
        python manage.py collectstatic --noinput &&
        echo 'Starting development server...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    networks:
      - autoakademia-network

  nginx:
    image: nginx:alpine
    container_name: autoakademia-nginx-local
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/autoakademia.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume_local:/app/staticfiles:ro
      - media_volume_local:/app/mediafiles:ro
    ports:
      - "80:80"
    depends_on:
      - django
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - autoakademia-network

volumes:
  postgres_data_local:
  static_volume_local:
  media_volume_local:

networks:
  autoakademia-network:
    driver: bridge
