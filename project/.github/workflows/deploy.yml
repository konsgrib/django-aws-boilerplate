name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: eu-west-1
  PYTHON_VERSION: '3.12'

jobs:
  # Job 1: Lint and Validate
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install flake8 black isort
          pip install cfn-lint

      - name: Run Black (code formatter check)
        run: |
          black --check src/

      - name: Run isort (import sorting check)
        run: |
          isort --check-only src/

      - name: Run flake8 (linting)
        run: |
          flake8 src/ --max-line-length=120 --exclude=migrations

      - name: Validate CloudFormation templates
        run: |
          cfn-lint -t project/cloudformation/infrastructure/resources.yaml

      - name: Validate bash scripts
        run: |
          find project/scripts -name "*.sh" -type f -exec bash -n {} \;

  # Job 2: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd src
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DJANGO_SECRET_KEY: 'test-secret-key-for-ci'
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_NAME: test_db
          DB_PORT: 5432
          ALLOWED_HOSTS: '*'
          DEBUG: 'true'
        run: |
          cd src
          python manage.py migrate --noinput

      - name: Run tests with coverage
        env:
          DJANGO_SECRET_KEY: 'test-secret-key-for-ci'
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_NAME: test_db
          DB_PORT: 5432
          ALLOWED_HOSTS: '*'
          DEBUG: 'true'
        run: |
          cd src
          pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./src/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 3: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: autoakademia-${{ steps.env.outputs.environment }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd src
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # Job 4: Deploy to AWS
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ steps.env.outputs.environment }}
      url: http://${{ steps.deploy.outputs.instance_ip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy CloudFormation stack
        id: deploy
        run: |
          cd project
          chmod +x scripts/deploy.sh scripts/setup-instance.sh
          ./scripts/deploy.sh ${{ steps.env.outputs.environment }}
          
          # Get instance IP
          INSTANCE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=autoakademia-${{ steps.env.outputs.environment }}-ec2-instance" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

      - name: Setup application
        run: |
          cd project
          ./scripts/setup-instance.sh ${{ steps.env.outputs.environment }}

      - name: Verify deployment
        run: |
          INSTANCE_IP=${{ steps.deploy.outputs.instance_ip }}
          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://$INSTANCE_IP/health/ | grep -q "200"; then
              echo "✅ Application is healthy!"
              exit 0
            fi
            echo "Attempt $i/30: Waiting..."
            sleep 10
          done
          echo "❌ Application health check failed"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "### ✅ Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Instance IP:** ${{ steps.deploy.outputs.instance_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**Application URL:** http://${{ steps.deploy.outputs.instance_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "**Admin Panel:** http://${{ steps.deploy.outputs.instance_ip }}/admin/" >> $GITHUB_STEP_SUMMARY
